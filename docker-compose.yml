networks:
  vulcan-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  vulcan_registry:
  repos_data:
  nginx_apps_conf:

services:
  # ── Nginx Init ───────────────────────────────────────────────────────────────
  # Creates a placeholder .conf in the nginx_apps_conf volume so nginx doesn't
  # fail on startup when no apps have been deployed yet (empty include glob).
  nginx-init:
    image: busybox
    volumes:
      - nginx_apps_conf:/apps
    command: >
      sh -c "mkdir -p /apps && echo '# VulcanPaaS — no apps deployed yet' > /apps/.placeholder.conf"
    restart: "no"

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    container_name: vulcanpaas-nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_apps_conf:/etc/nginx/conf.d/apps
    # host.docker.internal resolves to the Windows host IP on Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vulcan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      nginx-init:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: vulcan-frontend:${IMAGE_TAG:-latest}
    pull_policy: never
    networks:
      - vulcan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    container_name: vulcanpaas-api
    build:
      context: ./api
    image: vulcan-api:${IMAGE_TAG:-latest}
    pull_policy: never
    volumes:
      # Docker socket — works on Windows with Docker Desktop (WSL2 backend)
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount project root from Windows host; set PROJECT_ROOT in your .env
      - ${PROJECT_ROOT}:/workspace
      - repos_data:/workspace/repos
      - nginx_apps_conf:/workspace/nginx-apps
    environment:
      - PROJECT_PATH=/workspace
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GITHUB_POLL_INTERVAL=${GITHUB_POLL_INTERVAL:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vulcan-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    user: root
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vulcan-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - vulcan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
